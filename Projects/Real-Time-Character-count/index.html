<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time character count</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="count">
        <h3>Real-time character count </h3>
       <textarea id="textarea" class="textarea" placeholder="please enter your text here . . ." maxlength="150"></textarea>

       <div class="counter-container">
        <p >Total Character : <span class="total-counter" id="total-counter"></span></p>

       
        <p>Remaining : <span class="Remaining-counter" id="Remaining-counter"></span></p>
       
         
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
